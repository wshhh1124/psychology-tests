自己是不是说太重了", "type": "mild"}, {"text": "生气是正常的——我会用合适的方式说出来，不压也不炸", "type": "healthy"}]}, {"id": 14, "scene": "【深层篇 2/4】夜深了，你一个人。", "text": "如果这个世界上没有人需要你了——没人需要你帮忙、没人需要你照顾、没人需要你让ta开心——你还觉得自己有价值吗？", "options": [{"text": "这个问题让我慌——因为我的大部分价值感可能来自于「被需要」", "type": "heavy"}, {"text": "我会有一种空落落的感觉——但理论上我知道自己应该有独立的价值", "type": "moderate"}, {"text": "我会不太习惯——但我知道我有自己的事想做、有自己的价值", "type": "mild"}, {"text": "会——我的价值来自我是谁，不是来自别人对我的需要", "type": "healthy"}]}, {"id": 15, "scene": "【深层篇 3/4】讨好这件事，在你的生活里。", "text": "你觉得它是善良——还是你已经不能选了？", "options": [{"text": "我不知道怎么区分了——讨好和善良、讨好和懂事，好像早就混在一起了", "type": "heavy"}, {"text": "有时候是善良，有时候不是——但在具体的事情上我很难分清", "type": "moderate"}, {"text": "我能感觉到差别——善良让我温暖，讨好让我累", "type": "mild"}, {"text": "我清楚这个界限——我可以善良，但我不需要讨好", "type": "healthy"}]}, {"id": 16, "scene": "【深层篇 4/4】做完这16道题。", "text": "你心里冒出来的、最真实的那句话是什么？", "options": [{"text": "我是不是该改了——这个模式太久了，但我不知道怎么开始", "type": "heavy"}, {"text": "我知道自己有这样的问题——就是一直没认真面对", "type": "moderate"}, {"text": "我需要一些具体的、能做的事——不是大道理", "type": "mild"}, {"text": "我已经在路上——保持现在的方向就很好", "type": "healthy"}]}];
var names = {"heavy": "重度讨好", "moderate": "中度讨好", "mild": "轻度讨好", "healthy": "边界清晰"};
var details = {"heavy": {"tagline": "你的讨好不是习惯。它已经长成你的一部分——但你可以决定要不要继续让它替你说话。", "sections": [{"label": "一、讨好在你身上是怎么运作的", "text": "你不是偶尔讨好——讨好是你和世界打交道的方式。从小到大，你学会了一件事：你的真实感受——说出来会付出代价。可能是批评、可能是冷落、可能是「你怎么这么不懂事」。所以你形成了一套精密的策略：先确认别人要什么、先满足别人的期待、先让自己「不惹麻烦」。这套策略保护了你很多年。但它现在开始从你身上拿走东西了——你的愤怒、你的选择、你在关系里的自在。"}, {"label": "二、它拿走了什么", "text": "第一，拿走了你表达愤怒的能力。不是你不生气——是你不敢生气。你怕生气了别人会离开、怕生气了就变成了你不想要的那种人。第二，拿走了你确认自我价值的能力。你的价值感大比例来自「被需要」——你需要别人需要你，需要别人满意，需要别人不说你不好。第三，拿走了你在关系里舒服做自己的能力。你可以是任何人想要的样子——但你很少是自己想要的样子。"}, {"label": "三、它在什么情况下触发最严重", "text": "最容易触发你的情境有三个：面对权威（包括某些让你觉得「需要被认可」的平辈）、面对你在意但不确定对方是否同等在意你的人、以及任何「如果我做不好就会让人失望」的场景。你在这三种场景里，会变成一个和自己独处时完全不一样的人——更软、更犹豫、更不敢表达。这是你最累的时候，因为你在演。"}, {"label": "四、讨好和善良，在你身上怎么区分", "text": "善良是——你有东西想给。讨好是——你怕不给就会被拿走什么。当你帮了人之后心里是暖的、是平静的——那是善良。当你帮了人之后心里多了怨气、累、或者一种说不清的委屈——那是讨好。你已经帮了别人一辈子了。现在你需要学会帮一个人：你自己。"}, {"label": "五、你可以从哪里开始", "text": "不需要一夜之间变得「不讨好」。从最小的事开始：停止主动揽责任。别人不开心了——不是你造成的，不用你第一个出来修。别人没回消息——不是你的错，不用你追加解释。别人对你好——你不需要马上等价还回去，你可以只是收到。练习「不负责所有人的感受」。一次一点点。如果你做了一件事——随便一件——只因为你想要做、不是因为怕不做会失去什么。那就是你拿回来的第一寸土地。"}], "highlight": "一个今晚就能做的事：下次有人对你好——一句话、一个帮助、一份礼物——只说「谢谢」。不加「你太好了」「我都不知道怎么回报」「我欠你的」。收起后面那些话。就只是收到。看看什么都不「还」的感觉。"}, "moderate": {"tagline": "你的讨好有一个开关——在有些人面前关着，在有些人面前开着。关键不是关掉它，是决定谁来按开关。", "sections": [{"label": "一、你不是对所有人都这样", "text": "在大部分人面前，你是有边界、能表达、能做自己的。但只要有某个特定类型的人出现——让你感觉「我需要被ta认可」「ta对我的看法很重要」「我在ta面前不能翻车」——你的讨好模式就在后台启动了。你变成另一个版本：更软、更小心、更怕出错。这不是你的全部——只是你还没发现，你已经把开关交给了这些人。"}, {"label": "二、这么做的底层是什么", "text": "你在回避一个你不敢验证的问题：如果我不讨好，这些人还会继续在我身边吗？你不敢试。因为万一答案是否定的，你就少了一段在乎的关系。但你不试，你就永远不会知道答案——而且你会一直在消耗。一段需要你不断讨好才能维持的关系，你已经不是你自己了。你在维持的到底是关系，还是一个你扮演的角色？"}, {"label": "三、讨好和善良的混淆", "text": "你经常给自己的讨好找理由：这是善良、这是懂事、这是我在乎。有些确实是在乎。但你需要学会区分：做完这件事我是平静的、还是闷闷的？帮了这个人之后我是开心的、还是有点委屈？如果答案经常是后者——那不是善良。那是你在让步。善良不会让你觉得自己变小了。"}, {"label": "四、你的讨好最可能在哪儿出现", "text": "你的讨好不是全天候的。它最可能出现在：你面对权威或上级的时候、面对你「单方面在乎」的人的时候、以及面对任何会让你觉得「被评价」的社交场合。识别这些场景比什么都重要——因为当你提前知道自己会触发讨好模式，你就有了选择：这一次，我要不要开这个开关？"}, {"label": "五、你可以从哪里开始", "text": "找到一个人——就一个——你最不敢在ta面前说真话的人。下一次ta问你什么，不要猜ta想听什么。说你的真话。就一次。然后观察：关系没有塌。对方可能愣了一下，但ta没有走。你也没有变小。相反，你可能第一次感觉到——真实的你也是可以被接受的。不需要先讨好，才有资格存在。"}], "highlight": "一个练习：「延迟答应」。这周如果有人问你帮不帮忙、去不去、好不好——不要马上回答。先回「我看看我的安排，等下回复你」。这30秒的间隙，就是你在练习：我也可以先想我自己。"}, "mild": {"tagline": "你已经走过了最难的一步——从「不知道自己在讨好」到「知道自己在讨好」。接下来不是完全不做，是做选择。", "sections": [{"label": "一、你已经不是无意识的讨好了", "text": "最难的一关你不是现在才过的。最难的一关是——以前你讨好但不自知。你以为那就是善良、就是体贴、就是「大家不都这样吗」。但你现在意识到了。你知道了讨好和善良不是一回事。你知道自己在某些情境下会让步——让得太多。这个觉察本身就是一次真正的进步。"}, {"label": "二、你现在卡在哪里", "text": "卡在「知道了但还做不到」之间。你知道该说「不」，但说出口之前犹豫了三秒，然后还是说了「好」。你知道不用为别人的情绪负责，但当身边的人真的不开心时，你还是会本能地想「让我来」。这不是退步。这是新模式在和旧习惯谈判。每一次你犹豫之后选择了新方式——不管最终选没选——你都在削弱旧习惯的力量。"}, {"label": "三、你已经在改变的信号", "text": "你会事后想「其实我刚才可以不那样的」。你会偶尔说出自己想吃的餐厅、偶尔拒绝一件实在不想做的事、偶尔在别人不高兴的时候没有自动进入修复模式。这些「偶尔」不是不够——它们是证据。你在更多的时候是你自己了。只是你还没注意到而已。"}, {"label": "四、接下来要做什么", "text": "不是「完全不讨好任何人」。是每次意识到可能讨好了，问自己一句：这是我真心想给的，还是我怕不给会失去什么？如果是真心想给——好好给。如果是怕——那就给自己一个选项：不给。你做决定的速度会变慢。但你的每一个决定会更像你自己。从「偶尔」到「更多时候」再到「自然而然」——这就是路。"}], "highlight": "一个小仪式：每次你选择不讨好之后——不需要给自己找理由。你不用跟任何人证明「这个拒绝是正当的」。「我不想」「我不方便」「我这次不干了」本身就是充足的理由。跟自己说：我选了自己。这三个字比什么理由都有力。"}, "healthy": {"tagline": "你不是「不在乎别人」——你只是不需要讨好来证明你在乎。这个边界，是你值得骄傲的东西。", "sections": [{"label": "一、你不是冷漠，你是用另一种方式在在乎", "text": "你可能被人误解过——「你太直接了」「你不够体贴」「你太有主见」。但这里有一个重要的区别：讨好是和别人在一起时不断调整自己、希望被接受。而你——是在和别人在一起时保持自己、然后看看你们是不是真的合得来。这种在乎更深。因为你要的不是一段靠讨好维持的关系。你要的是真实的连接。"}, {"label": "二、这个边界是怎么来的", "text": "可能你成长的环境里，情绪是被允许的，你是被尊重的。也可能是你后来自己花了很大力气，一步步学会了设立边界。不管怎么来的——这是一项很多人在花半辈子试图学会的能力。你不是没有讨好过。你可能曾经也在某些阶段讨好过。但你现在可以选了。这不是轻飘飘的「想开点」——这是你花了真实力气才得到的。"}, {"label": "三、保持它的三个提醒", "text": "第一，不是所有人都值得你解释。有人因为你不再讨好而不高兴——那是他们在习惯你以前的样子，不是你的问题。第二，边界不是永远强硬——它是灵活的。有时候你可以选择退让，因为你在乎。区别是：退让是你的选择，不是你的本能。第三，你的感受是你最可靠的边界传感器。如果你觉得不舒服——那就是边界在被碰到。听它的。"}, {"label": "四、你的价值不依附于任何人的评价", "text": "你可以被喜欢、也可以不被喜欢。被喜欢当然好——但不被喜欢的时候，你的自我不会跟着碎。这不是傲慢。这是你花了很多力气才得到的东西。珍惜它。有人说你变了——那恭喜你。因为你不是他们记忆中的那个「好说话」的人了。你是现在的你。够好了。"}], "highlight": "如果有人因为你设立了边界而生气——不要解释，不要道歉，不要改回去。那个不舒服是边界在正常工作。不是你错了。"}};
var typeOrder = ["heavy", "moderate", "mild", "healthy"];
var cur = 0, answers = {}, sel = null;
function startTest() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('main').classList.add('visible');
  renderQuestion(); window.scrollTo(0, 0);
}
function renderProgress() {
  var h = '';
  for (var i = 0; i < questions.length; i++) {
    var c = 'dot';
    if (answers[questions[i].id]) c += ' done';
    if (i === cur) c += ' current';
    h += '<div class="' + c + '"></div>';
  }
  document.getElementById('progress').innerHTML = h;
}
function renderQuestion() {
  var q = questions[cur];
  var h = '<div class="q-card">';
  h += '<p class="q-section">' + q.scene + '</p>';
  h += '<p class="q-num">' + q.text + '</p>';
  h += '<div class="q-opts">';
  for (var i = 0; i < q.options.length; i++) {
    var o = q.options[i], l = ['A','B','C','D'], c = 'q-opt';
    if (sel === i) c += ' selected';
    h += '<div class="' + c + '" onclick="selectOption(' + i + ')"><strong>' + l[i] + '.</strong> ' + o.text + '</div>';
  }
  h += '</div></div>';
  document.getElementById('question-area').innerHTML = h;
  var b = document.getElementById('btn-next');
  b.textContent = cur === questions.length - 1 ? '查看结果' : '下一题';
  b.disabled = (sel === null);
  b.style.display = 'block';
  document.getElementById('btn-restart').style.display = 'none';
  document.getElementById('result-card').classList.remove('open');
  renderProgress();
}
function selectOption(i) {
  sel = i;
  document.getElementById('btn-next').disabled = false;
  document.querySelectorAll('.q-opt').forEach(function(o, j) { o.classList.toggle('selected', j === i); });
}
function nextQuestion() {
  if (sel === null) return;
  answers[questions[cur].id] = questions[cur].options[sel].type;
  if (cur < questions.length - 1) { cur++; sel = null; renderQuestion(); window.scrollTo(0, 0); }
  else { showResult(); }
}
function showResult() {
  document.getElementById('question-area').innerHTML = '';
  document.getElementById('progress').innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-restart').style.display = 'block';
  var c = {};
  for (var i = 0; i < typeOrder.length; i++) c[typeOrder[i]] = 0;
  for (var id in answers) c[answers[id]]++;
  var mt = typeOrder[0], mc = 0;
  for (var t in c) if (c[t] > mc) { mc = c[t]; mt = t; }
  var d = details[mt], tot = questions.length;
  document.getElementById('result-type').textContent = names[mt];
  document.getElementById('result-tagline').textContent = d.tagline;
  var bh = '';
  for (var i = 0; i < typeOrder.length; i++) {
    var t = typeOrder[i], p = Math.round(c[t] / tot * 100);
    bh += '<div class="bar-row"><span class="bar-label">' + names[t] + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(p, 8) + '%">' + (p > 15 ? p + '%' : '') + '</div></div></div>';
  }
  document.getElementById('result-bars').innerHTML = bh;
  var dh = '';
  for (var j = 0; j < d.sections.length; j++) {
    var s = d.sections[j];
    dh += '<div class="result-section"><p class="r-label">' + s.label + '</p><p class="r-text">' + s.text + '</p></div>';
  }
  dh += '<div class="result-highlight">' + d.highlight + '</div>';
  document.getElementById('result-detail').innerHTML = dh;
  document.getElementById('result-card').classList.add('open');
  document.getElementById('result-card').scrollIntoView({behavior:'smooth',block:'start'});
}
function restart() {
  cur = 0; answers = {}; sel = null;
  document.getElementById('result-card').classList.remove('open');
  renderQuestion(); window.scrollTo(0, 0);
}
</script>
