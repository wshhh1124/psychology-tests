<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>讨好型人格测试</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:#faf9f6;color:#1c1916;padding:28px 20px 80px;min-height:100vh}
.container{max-width:420px;margin:0 auto}
.cover{text-align:center;padding:60px 20px 40px;display:block}
.cover.hidden{display:none}
.cover-icon{font-size:64px;margin-bottom:20px}
.cover h1{font-size:28px;font-weight:900;margin-bottom:12px}
.cover .cover-sub{font-size:15px;color:#8a8278;line-height:1.7;margin-bottom:28px}
.cover .cover-info{display:flex;justify-content:center;gap:32px;margin-bottom:36px;font-size:13px;color:#8a8278}
.cover .cover-info span{text-align:center}
.cover .cover-info strong{display:block;font-size:20px;color:#d4704a}
.btn-start{display:block;width:100%;padding:16px;border-radius:14px;font-size:18px;font-weight:700;cursor:pointer;border:none;background:#d4704a;color:#fff}
.btn-start:active{filter:brightness(.85)}
.main{display:none}
.main.visible{display:block}
h1{font-size:24px;font-weight:800;text-align:center;margin-bottom:4px}
.sub{font-size:14px;color:#8a8278;text-align:center;margin-bottom:32px}
.progress{display:flex;gap:6px;justify-content:center;margin-bottom:28px}
.progress .dot{width:10px;height:10px;border-radius:50%;background:#e0dcd6}
.progress .dot.done{background:#d4704a}
.progress .dot.current{background:#d4704a;box-shadow:0 0 0 4px rgba(212,112,74,.2)}
.q-card{background:#fff;border-radius:18px;padding:28px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04)}
.q-num{font-size:13px;font-weight:700;color:#d4704a;letter-spacing:.1em;margin-bottom:8px}
.q-scene{font-size:15px;color:#8a8278;line-height:1.6;margin-bottom:16px;padding:14px 18px;background:#faf8f5;border-radius:12px}
.q-text{font-size:18px;font-weight:700;line-height:1.5;margin-bottom:20px}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{padding:16px 18px;background:#f7f4f0;border-radius:12px;font-size:15px;line-height:1.4;cursor:pointer;border:2px solid transparent}
.q-opt:active{background:#efe8e0}
.q-opt.selected{border-color:#d4704a;background:#fdf4f0}
.btn{display:block;width:100%;padding:16px;border-radius:14px;font-size:17px;font-weight:700;text-align:center;cursor:pointer;border:none;margin-bottom:12px}
.btn-primary{background:#d4704a;color:#fff}
.btn-primary:active{filter:brightness(.85)}
.btn-primary:disabled{background:#e0c8b8;cursor:default}
.btn-outline{background:#fff;color:#d4704a;border:2px solid #d4704a}
.result-card{background:#fff;border-radius:18px;padding:32px 24px;margin-bottom:20px;box-shadow:0 1px 3px rgba(0,0,0,.04);display:none}
.result-card.open{display:block}
.result-type{font-size:28px;font-weight:900;text-align:center;margin-bottom:8px;color:#d4704a}
.result-tagline{font-size:15px;color:#8a8278;text-align:center;margin-bottom:24px;font-style:italic}
.result-divider{height:1px;background:#f0ede6;margin:20px 0}
.result-section{margin-bottom:16px}
.result-section .r-label{font-size:13px;font-weight:700;color:#8a8278;margin-bottom:6px}
.result-section .r-text{font-size:15px;line-height:1.7;color:#3d3830}
.result-highlight{background:#fdf4f0;border-radius:12px;padding:16px 18px;font-size:14px;line-height:1.7;color:#d4704a;border-left:3px solid #d4704a;margin-top:12px}
.result-note{background:#fdf8f0;border-radius:12px;padding:14px 18px;font-size:13px;line-height:1.6;color:#8a6d3b;margin-top:16px}
.bars{margin:16px 0}
.bar-row{display:flex;align-items:center;gap:10px;margin-bottom:10px;font-size:14px}
.bar-row .bar-label{width:65px;text-align:right;font-weight:600;flex-shrink:0}
.bar-row .bar-track{flex:1;height:24px;background:#f0ede8;border-radius:12px;overflow:hidden}
.bar-row .bar-fill{height:100%;border-radius:12px;background:#d4704a;min-width:20px;display:flex;align-items:center;padding-left:10px;font-size:12px;color:#fff;font-weight:600}
.footer{text-align:center;margin-top:32px;padding:24px 0;border-top:1px solid #f0ede6}
.footer p{font-size:13px;color:#8a8278;line-height:1.8}
</style>
</head>
<body>
<div class="container">
<div class="cover" id="cover">
  <div class="cover-icon">🤲</div>
  <h1>讨好型人格测试</h1>
  <p class="cover-sub">你是不是总在照顾别人的感受、总在担心别人怎么看你、总在说「没事」其实有事？不是问你是不是讨好型。是问——这个模式在你的人生里扎了多深。6个情境，每一种都是你可能经历过的事。</p>
  <div class="cover-info">
    <span><strong>6</strong>个情境</span>
    <span><strong>4</strong>种结果</span>
    <span><strong>2</strong>分钟</span>
  </div>
  <button class="btn-start" onclick="startTest()">开始测试</button>
</div>
<div class="main" id="main">
<div class="progress" id="progress"></div>
<div id="question-area"></div>
<button class="btn btn-primary" id="btn-next" onclick="nextQuestion()" disabled>下一题</button>
<button class="btn btn-outline" id="btn-restart" onclick="restart()" style="display:none">重新测试</button>
<div class="result-card" id="result-card">
  <div class="result-type" id="result-type"></div>
  <div class="result-tagline" id="result-tagline"></div>
  <div class="result-divider"></div>
  <div class="bars" id="result-bars"></div>
  <div class="result-divider"></div>
  <div id="result-detail"></div>
  <div class="result-note"><strong>使用说明：</strong>本测试用于自我探索，不用于心理诊断。讨好倾向没有绝对的好坏——关键是觉察它、理解它从哪里来、决定要不要松绑。</div>
</div>
<div class="footer"><p>镜子测试局 · 讨好型人格测试</p><p style="margin-top:4px">你测完的结果是哪一种？回到笔记评论区聊聊</p></div>
</div>
</div>
<script>
var questions = [{"id": 1, "scene": "回想一下你长大的过程。", "text": "当你表达不同意见、或者做了一件大人不认可的事，你通常会得到什么反应？", "options": [{"text": "被严厉批评/惩罚——我说了也没用，不如不说", "type": "heavy"}, {"text": "被冷落或失望的眼神——不说话比说错更安全", "type": "moderate"}, {"text": "有时候被允许说，有时候不行——要看大人的心情", "type": "mild"}, {"text": "大多数时候被尊重——我的意见被认真对待了", "type": "healthy"}]}, {"id": 2, "scene": "有人帮你一个忙，或者给你一个礼物。", "text": "你收到的时候，第一反应是什么？", "options": [{"text": "赶快想怎么还回去——我不习惯欠别人的", "type": "heavy"}, {"text": "有点不自在——反复确认对方真的愿意帮我", "type": "moderate"}, {"text": "开心，但会记在心里以后找机会回报", "type": "mild"}, {"text": "自然地接受感谢——别人帮我是因为ta愿意，不是因为我有义务还", "type": "healthy"}]}, {"id": 3, "scene": "你在一个群体里——同事群、朋友群、家庭聚会——你感觉气氛不太对。", "text": "你心里的第一反应是？", "options": [{"text": "是不是我惹谁不高兴了？我赶紧想想我刚才做了什么", "type": "heavy"}, {"text": "虽然不确定是不是我的原因，但先让自己变得更友好一点", "type": "moderate"}, {"text": "观察一下到底发生了什么事，再决定要不要介入", "type": "mild"}, {"text": "气氛不好是大家的事，不是必须由我来修复", "type": "healthy"}]}, {"id": 4, "scene": "你上一次生气，是什么时候？", "text": "你允许自己表达出来了吗？", "options": [{"text": "我很少生气——或者我生气了也不会说出来，说出来就失控了", "type": "heavy"}, {"text": "我会生气，但我会压——压着压着就连自己都忘了在气什么", "type": "moderate"}, {"text": "有时候会表达——但通常事后会后悔，觉得是不是说太重了", "type": "mild"}, {"text": "生气是正常的——我会找合适的方式说出来，不压着也不爆炸", "type": "healthy"}]}, {"id": 5, "scene": "在某个重要关系里——可能是伴侣、可能是最好的朋友、可能是某个你特别在意的人——你有没有过这种感觉：", "text": "为了和ta保持好的关系，你慢慢不知道自己是谁了。", "options": [{"text": "有——这件事我一直在回避面对", "type": "heavy"}, {"text": "偶尔有这种感觉——有些时候我确实不再是「我自己」", "type": "moderate"}, {"text": "以前有，但现在好多了——我学会了在关系里保持自己的形状", "type": "mild"}, {"text": "没有——我和重要的人在一起时，反而更知道自己是谁", "type": "healthy"}]}, {"id": 6, "scene": "夜深了，你一个人。", "text": "如果这个世界上没有人需要你了——没人需要你帮忙、没人需要你照顾、没人需要你让ta开心——你还觉得自己有价值吗？", "options": [{"text": "这个问题让我慌——因为我大部分价值感可能来自「被需要」", "type": "heavy"}, {"text": "我会有点空——但我知道理论上我应该有自己的价值", "type": "moderate"}, {"text": "我会不太习惯——但我知道我有自己的事想做", "type": "mild"}, {"text": "会——我的价值不来自别人需要我，来自我是谁", "type": "healthy"}]}];
var names = {"heavy": "重度讨好", "moderate": "中度讨好", "mild": "轻度讨好", "healthy": "边界清晰"};
var details = {"heavy": {"tagline": "你的讨好——它不是习惯。它已经是你人格的一部分。", "sections": [{"label": "你的讨好从哪里来", "text": "不是天生的。是在你长大的过程中，你学会了一件事：你的真实感受——说出来会付出代价。可能是批评、可能是冷落、可能是惩罚。所以你学会了一个策略：先满足别人的期待，再考虑自己。这不是软弱。这是你在那个环境里能找到的最聪明的自我保护。"}, {"label": "它现在在从你身上拿走什么", "text": "它拿走了你表达愤怒的能力。拿走了你确认自己价值不需要靠别人的能力。拿走了你在关系里舒服做自己的能力。你帮了别人一万次，但你不敢让任何人帮你一次——因为你怕欠。你怕一旦你开始「要」，别人就会走。"}, {"label": "一个起点", "text": "讨好不是一天形成的，也不会一天消失。但你可以从一件事开始：停止主动揽责任。别人不开心——不是你造成的，你不必第一个跳出来修复。别人不回复消息——不是你的错，你不需要追加解释。练习「不负责所有人的感受」，一次一点点。"}], "highlight": "今晚试一件事：如果有人对你好，只收不说谢谢以外的任何话。不收「你太好了」、不收「我都不知道怎么回报」、不收自我贬低。就只是收到。观察一下不「还」的感觉。"}, "moderate": {"tagline": "你的讨好——你知道它存在，但你还在和它谈判。", "sections": [{"label": "讨好在你身上是怎么运作的", "text": "你不是对所有人都这样。在大部分关系里你是有边界的。但只要遇到了某个特定的人——可能是权威、可能是你单方面在乎的人、可能是让你感觉「我需要被ta喜欢」的人——你的讨好模式就会自动接管。你变成另一个人。一个更软、更不敢说话、更怕做错的人。"}, {"label": "你在回避什么", "text": "你在回避一个你很怕验证的事：如果我不讨好，这个人还会留在我身边吗？你不敢试。因为万一答案是否定的——你就失去了一段关系。但你有没有想过：一段需要你不断讨好才能维持的关系，你其实已经失去了自己。你还是你吗？还是你在演一个「让对方舒服的你」？"}, {"label": "一次小实验", "text": "找到那个你最不敢拒绝的人。就一个。下一次ta问你什么——不一定是请求，可能只是问「你觉得呢」——不要猜ta想听什么。说你的真实想法。就一次。然后观察。观察关系没有塌。观察对方没有走。观察你自己：那个真实的感觉，和你讨好时完全不一样。"}], "highlight": "这周给自己一个任务：在一个人面前，允许自己「不够好」。不用照顾ta的情绪、不用帮ta解决问题、不用让ta觉得你很棒。就待着。看看会发生什么。"}, "mild": {"tagline": "你的讨好——它是个旧习惯。你已经意识到它了，正在学新的。", "sections": [{"label": "你已经走过最难的部分了", "text": "最难的是「看不见」。你以前讨好但不自知——以为那就是善良、以为那就是体贴、以为大家不都这样吗。但现在你知道了：讨好和善良不是一回事。善良是你有东西想给；讨好是你怕不给就失去。你已经开始区分这两件事了。"}, {"label": "你现在卡在哪里", "text": "你现在知道什么时候该说「不」了。但知道和做到之间，还隔着一层——你会在重要时刻退回去。你可能会在说了「不」之后后悔、内疚、觉得自己自私。这不是退步。这是旧模式和你在拉扯。每一次你选择不讨好，都是在对旧模式说：你不再决定我的选择了。"}], "highlight": "继续练。每次你选择不讨好之后，不需要给自己找理由。你不需要证明「这个拒绝是正当的」。你的感受本身就是正当理由。只需要对自己说：我想这么做。就只是我想。"}, "healthy": {"tagline": "你的边界——这是你花了很多力气建起来的。不要轻易拆掉。", "sections": [{"label": "你不是「不在乎别人」", "text": "你可能被误解过——说你太直接、不够体贴、太自我。但真相是：你不是不在乎。你是在乎的方式不一样。你不想演。你不希望关系建立在「你为我改变了什么」上面。你希望被接受的是你这个人。这种在乎，比讨好深刻得多。"}, {"label": "守住你的边界", "text": "有人可能会因为你不再讨好而离开。那是他们的选择——他们习惯了那个「好说话」的你。但留下来的人，是喜欢你本人的。那些关系不需要你用讨好来维持。它们值钱。"}], "highlight": "如果有人因为你设了边界而生气——那是你的边界在正常工作。好的边界不是墙，是皮肤。你只是不允许别人随随便便穿过你。"}};
var typeOrder = ["heavy", "moderate", "mild", "healthy"];
var cur = 0, answers = {}, sel = null;
function startTest() {
  document.getElementById('cover').classList.add('hidden');
  document.getElementById('main').classList.add('visible');
  renderQuestion(); window.scrollTo(0, 0);
}
function renderProgress() {
  var h = '';
  for (var i = 0; i < questions.length; i++) {
    var c = 'dot';
    if (answers[questions[i].id]) c += ' done';
    if (i === cur) c += ' current';
    h += '<div class="' + c + '"></div>';
  }
  document.getElementById('progress').innerHTML = h;
}
function renderQuestion() {
  var q = questions[cur];
  var h = '<div class="q-card">';
  h += '<p class="q-num">情境 ' + q.id + ' / ' + questions.length + '</p>';
  h += '<p class="q-scene">' + q.scene + '</p>';
  h += '<p class="q-text">' + q.text + '</p>';
  h += '<div class="q-opts">';
  for (var i = 0; i < q.options.length; i++) {
    var o = q.options[i], l = ['A','B','C','D'], c = 'q-opt';
    if (sel === i) c += ' selected';
    h += '<div class="' + c + '" onclick="selectOption(' + i + ')"><strong>' + l[i] + '.</strong> ' + o.text + '</div>';
  }
  h += '</div></div>';
  document.getElementById('question-area').innerHTML = h;
  var b = document.getElementById('btn-next');
  b.textContent = cur === questions.length - 1 ? '查看结果' : '下一题';
  b.disabled = (sel === null);
  b.style.display = 'block';
  document.getElementById('btn-restart').style.display = 'none';
  document.getElementById('result-card').classList.remove('open');
  renderProgress();
}
function selectOption(i) {
  sel = i;
  document.getElementById('btn-next').disabled = false;
  document.querySelectorAll('.q-opt').forEach(function(o, j) { o.classList.toggle('selected', j === i); });
}
function nextQuestion() {
  if (sel === null) return;
  answers[questions[cur].id] = questions[cur].options[sel].type;
  if (cur < questions.length - 1) { cur++; sel = null; renderQuestion(); window.scrollTo(0, 0); }
  else { showResult(); }
}
function showResult() {
  document.getElementById('question-area').innerHTML = '';
  document.getElementById('progress').innerHTML = '';
  document.getElementById('btn-next').style.display = 'none';
  document.getElementById('btn-restart').style.display = 'block';
  var c = {};
  for (var i = 0; i < typeOrder.length; i++) c[typeOrder[i]] = 0;
  for (var id in answers) c[answers[id]]++;
  var mt = typeOrder[0], mc = 0;
  for (var t in c) if (c[t] > mc) { mc = c[t]; mt = t; }
  var d = details[mt], tot = questions.length;
  document.getElementById('result-type').textContent = names[mt];
  document.getElementById('result-tagline').textContent = d.tagline;
  var bh = '';
  for (var i = 0; i < typeOrder.length; i++) {
    var t = typeOrder[i], p = Math.round(c[t] / tot * 100);
    bh += '<div class="bar-row"><span class="bar-label">' + names[t] + '</span><div class="bar-track"><div class="bar-fill" style="width:' + Math.max(p, 8) + '%">' + (p > 15 ? p + '%' : '') + '</div></div></div>';
  }
  document.getElementById('result-bars').innerHTML = bh;
  var dh = '';
  for (var j = 0; j < d.sections.length; j++) {
    var s = d.sections[j];
    dh += '<div class="result-section"><p class="r-label">' + s.label + '</p><p class="r-text">' + s.text + '</p></div>';
  }
  dh += '<div class="result-highlight">' + d.highlight + '</div>';
  document.getElementById('result-detail').innerHTML = dh;
  document.getElementById('result-card').classList.add('open');
  document.getElementById('result-card').scrollIntoView({behavior:'smooth',block:'start'});
}
function restart() {
  cur = 0; answers = {}; sel = null;
  document.getElementById('result-card').classList.remove('open');
  renderQuestion(); window.scrollTo(0, 0);
}
</script>
</body>
</html>
