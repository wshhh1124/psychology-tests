<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>依恋类型 · 设计稿</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#fff;display:flex;justify-content:center;padding:48px}
.card{
  position:relative;width:1080px;height:1440px;overflow:hidden;
  background:linear-gradient(160deg, #fef9f4 0%, #fdf2f5 30%, #fce7ed 60%, #fdf5f7 100%);
  font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",-apple-system,sans-serif;
  color:#2d1020;
}

/* Large decorative circle */
.orb-1{
  position:absolute;top:-180px;right:-120px;
  width:620px;height:620px;border-radius:50%;
  background:radial-gradient(circle at 40% 40%, rgba(196,91,122,.12) 0%, rgba(196,91,122,.03) 60%, transparent 100%);
}
.orb-2{
  position:absolute;bottom:-100px;left:-80px;
  width:400px;height:400px;border-radius:50%;
  background:radial-gradient(circle at 60% 60%, rgba(240,130,100,.08) 0%, rgba(240,130,100,.02) 50%, transparent 100%);
}

/* Abstract geometric accent */
.geo-ring{
  position:absolute;top:280px;right:60px;
  width:160px;height:160px;border-radius:50%;
  border:3px solid rgba(196,91,122,.15);
}
.geo-ring::after{
  content:'';position:absolute;top:20px;left:20px;
  width:120px;height:120px;border-radius:50%;
  border:2px dashed rgba(196,91,122,.10);
}
.geo-dot{
  position:absolute;top:100px;right:200px;
  width:12px;height:12px;border-radius:50%;background:#c45b7a;opacity:.4;
}
.geo-dot2{
  position:absolute;top:450px;right:120px;
  width:8px;height:8px;border-radius:50%;background:#c45b7a;opacity:.25;
}

/* Line accent */
.line-h{
  position:absolute;top:600px;right:40px;
  width:120px;height:1px;background:rgba(196,91,122,.20);
}
.line-v{
  position:absolute;top:340px;right:138px;
  width:1px;height:80px;background:rgba(196,91,122,.12);
}

/* Content */
.content{padding:90px 80px;position:relative;z-index:2;height:100%;display:flex;flex-direction:column;justify-content:space-between}
.top-row{display:flex;justify-content:space-between;align-items:flex-start}
.tag-row{display:flex;gap:10px}
.tag{font-size:14px;font-weight:600;padding:7px 16px;border-radius:16px;letter-spacing:.05em}
.tag-outline{color:#c45b7a;border:1.5px solid rgba(196,91,122,.3)}
.tag-fill{background:rgba(196,91,122,.10);color:rgba(196,91,122,.70)}

/* Number decorative */
.num-deco{font-size:160px;font-weight:900;color:rgba(196,91,122,.04);line-height:1;letter-spacing:-.04em}

/* Main title area */
.title-area{margin-top:-30px}
.title-big{font-size:130px;font-weight:900;line-height:1.06;letter-spacing:-.02em}
.title-big .em{color:#c45b7a}
.title-big .hl{background:linear-gradient(180deg,transparent 62%, rgba(196,91,122,.18) 62%);padding:0 6px}

/* Description */
.desc{font-size:26px;color:rgba(45,16,32,.45);line-height:1.6;max-width:600px;margin-top:24px}

/* Bottom info card */
.info-card{
  background:rgba(255,255,255,.55);border-radius:20px;
  padding:28px 32px;display:flex;align-items:center;gap:24px;
  border:1px solid rgba(196,91,122,.10);
  backdrop-filter:blur(10px);
}
.info-card .stat{text-align:center}
.info-card .stat-num{font-size:36px;font-weight:900;color:#c45b7a;line-height:1}
.info-card .stat-label{font-size:13px;color:rgba(45,16,32,.40);margin-top:4px}
.info-div{width:1px;height:36px;background:rgba(196,91,122,.12)}

/* Corner character */
.char{
  position:absolute;bottom:40px;right:60px;z-index:2;
  width:220px;height:220px;opacity:.7;
}
</style>
</head>
<body>

<div class="card">
  <div class="orb-1"></div>
  <div class="orb-2"></div>
  <div class="geo-ring"></div>
  <div class="geo-dot"></div>
  <div class="geo-dot2"></div>
  <div class="line-h"></div>
  <div class="line-v"></div>

  <div class="content">
    <div class="top-row">
      <div class="tag-row">
        <span class="tag tag-fill">成人依恋</span>
        <span class="tag tag-outline">ECR量表</span>
      </div>
    </div>

    <div>
      <div class="num-deco">02</div>
      <div class="title-area">
        <h1 class="title-big">对方三小时<br>没回消息<br>你已经<span class="hl">演完了</span><br><span class="em">一整部电影</span></h1>
      </div>
      <p class="desc">焦虑型依恋：不是太作，是太怕被抛弃</p>
    </div>

    <div class="info-card">
      <div class="stat"><div class="stat-num">12</div><div class="stat-label">道题</div></div>
      <div class="info-div"></div>
      <div class="stat"><div class="stat-num">2min</div><div class="stat-label">做完</div></div>
      <div class="info-div"></div>
      <div class="stat"><div class="stat-num">4</div><div class="stat-label">种类型</div></div>
      <div class="info-div"></div>
      <div style="flex:1;text-align:right;font-size:18px;color:rgba(45,16,32,.40)">Bowlby · Ainsworth · ECR</div>
    </div>
  </div>
</div>

</body>
</html>
